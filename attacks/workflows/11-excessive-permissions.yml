# expect: excessive-permissions
# write-all hands every step, and every action it calls, a token that can push code, cut
# releases and edit workflows. One compromised dependency then owns the repository.
name: excessive-permissions
on: pull_request
permissions: write-all
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test
