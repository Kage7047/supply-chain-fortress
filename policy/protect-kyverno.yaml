# Kyverno cannot be scaled to zero or deleted.
#
# When Kyverno's Deployment is scaled to zero or deleted, its last pod deletes all of Kyverno's
# webhook configurations on the way out (pkg/webhooks/server.go, cleanup). That is deliberate,
# so a dead Kyverno cannot brick the cluster, but it means `failurePolicy: Fail` never applies:
# pods are admitted unchecked, and nothing reports an error (attack a14). failurePolicy only
# covers a Kyverno that is still deployed but cannot answer (attack a09).
#
# This is a built-in ValidatingAdmissionPolicy: the API server evaluates it, so it does not depend
# on Kyverno being up. To take Kyverno down on purpose, delete the binding first; that is a
# deliberate, audited act rather than a `kubectl scale` that switches enforcement off.
#
# The second policy keeps anyone but Kyverno from deleting or rewriting Kyverno's webhook
# configurations, the other way to switch it off (attack a15). Admission webhooks, Kyverno
# included, never see requests for webhook configurations; built-in policies do.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fortress-kyverno-stays-up
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE, DELETE]
        resources: [deployments, deployments/scale]
        resourceNames: [kyverno-admission-controller]
  validations:
    - expression: request.operation != 'DELETE'
      message: Kyverno's admission controller cannot be deleted
    # A Scale object leaves `replicas` out when it is 0 (omitempty), so a missing field means zero,
    # not "unset". Deployments always have it after defaulting.
    - expression: >-
        request.operation == 'DELETE' || (has(object.spec.replicas) && object.spec.replicas >= 1)
      message: >-
        Kyverno's admission controller cannot be scaled to zero: on the way down it deletes its own
        webhooks, and every pod after that is admitted unchecked
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fortress-kyverno-stays-up
spec:
  policyName: fortress-kyverno-stays-up
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - { key: kubernetes.io/metadata.name, operator: In, values: [kyverno] }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fortress-kyverno-webhooks-stay
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [admissionregistration.k8s.io]
        apiVersions: [v1]
        operations: [UPDATE, DELETE]
        resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
    objectSelector:
      matchExpressions:
        - { key: webhook.kyverno.io/managed-by, operator: Exists }
  matchConditions:
    # Kyverno keeps its own webhooks up to date, and removes them when it is meant to go away.
    - name: not-kyverno
      expression: request.userInfo.username != 'system:serviceaccount:kyverno:kyverno-admission-controller'
  validations:
    - expression: "false"
      message: only Kyverno may change or delete its webhook configurations
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fortress-kyverno-webhooks-stay
spec:
  policyName: fortress-kyverno-webhooks-stay
  validationActions: [Deny]
