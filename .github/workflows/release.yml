# The only workflow whose signature the cluster accepts (policy/image-signatures.yaml names this
# file on refs/heads/main). It builds the image, pushes it by digest, signs it, attests its SBOM
# and SLSA provenance, then proves the unmodified production policies admit it.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing: Fulcio certifies this workflow's identity
      attestations: write # GitHub's build provenance
    outputs:
      image: ${{ steps.build.outputs.image }}
    env:
      KO_DOCKER_REPO: ghcr.io/kage7047/supply-chain-fortress/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a poisoned build cache would flow straight into the signed image
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: go settings keep the checksum database on
        run: test/gocheck.sh env # before go install fetches ko and its dependencies
      - name: install ko
        run: go install github.com/google/ko@v0.19.1
      - name: log in to GHCR
        run: echo "$TOKEN" | "$(go env GOPATH)/bin/ko" login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - name: build and push
        id: build
        run: |
          "$(go env GOPATH)/bin/ko" build ./app --bare --tags "$GITHUB_SHA" --sbom-dir sbom --image-refs ref.txt
          digest=$(sed 's/.*@//' ref.txt)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "image=$KO_DOCKER_REPO@$digest" >>"$GITHUB_OUTPUT"
      - name: sign
        run: cosign sign --yes "$IMAGE"
        env:
          IMAGE: ${{ steps.build.outputs.image }}
      - name: attest SBOM
        run: cosign attest --yes --type spdxjson --predicate "$(find sbom -name '*.json' | head -1)" "$IMAGE"
        env:
          IMAGE: ${{ steps.build.outputs.image }}
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/kage7047/supply-chain-fortress/app
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: verify as a consumer would
        run: |
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" >/dev/null
          echo "### Released" >>"$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE\`" >>"$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ steps.build.outputs.image }}

  admit:
    name: production policies admit the release
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OUT: test/out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - run: test/tools.sh
      - run: test/cluster-up.sh >/dev/null
      - run: test/admit.sh "$IMAGE"
        env:
          IMAGE: ${{ needs.release.outputs.image }}
      - name: Kyverno logs
        if: failure()
        run: kubectl -n kyverno logs -l app.kubernetes.io/component=admission-controller --tail=300
